<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>Blog Posts with State Handling</title>
    <style>
        .post-card {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 10px;
        }

        /* 初期状態では状態表示用の要素を隠す */
        #loading,
        #error,
        #empty {
            display: none;
            font-size: 1.2em;
            color: #555;
        }

        #error {
            color: red;
        }
    </style>
</head>

<body>
    <h1>Blog Posts</h1>

    <!-- コンテナ -->
    <div id="posts-container"></div>

    <!-- 状態表示 -->
    <div id="loading">読み込み中...</div>
    <div id="error">エラーが発生しました。時間をおいて再読み込みしてください。</div>
    <div id="empty">投稿がありません。</div>

    <script src="04.js"></script>
</body>

</html>
